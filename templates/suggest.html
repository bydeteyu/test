<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동완성 키워드 수집</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f0f2f7; min-height: 100vh; }
header { background: #1a1a2e; color: #fff; padding: 16px 28px; display: flex; align-items: center; gap: 16px; }
header a { color: rgba(255,255,255,.5); text-decoration: none; font-size: .85rem; }
header a:hover { color: #fff; }
header h1 { font-size: 1rem; font-weight: 700; color: #fff; }
.wrap { max-width: 860px; margin: 32px auto; padding: 0 18px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,.06); padding: 24px; margin-bottom: 20px; }
label.lbl { display: block; font-weight: 600; margin-bottom: 6px; font-size: .92rem; }
.hint { font-size: .78rem; color: #aaa; margin-bottom: 9px; }
input[type=text] { width: 100%; border: 1.5px solid #e0e3ed; border-radius: 8px; padding: 10px 12px; font-size: .9rem; outline: none; transition: border .18s; background: #fafbfd; }
input[type=text]:focus { border-color: #03c75a; background: #fff; }
.row { display: flex; gap: 12px; align-items: flex-end; margin-top: 14px; }
.sel-wrap { display: flex; flex-direction: column; gap: 6px; }
select { border: 1.5px solid #e0e3ed; border-radius: 8px; padding: 10px 12px; font-size: .9rem; outline: none; background: #fafbfd; cursor: pointer; }
button.run { flex: 1; padding: 11px; background: #03c75a; color: #fff; font-size: .97rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: background .2s; }
button.run:hover { background: #02a84b; }
button.run:disabled { background: #b2dfcc; cursor: not-allowed; }
.sbar { display: none; padding: 10px 14px; border-radius: 8px; font-size: .87rem; margin-bottom: 14px; }
.sbar.running { background: #fff8e1; color: #9a6e00; border: 1px solid #ffe082; }
.sbar.done    { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
.sbar.error   { background: #fce4ec; color: #c62828; border: 1px solid #f48fb1; }
.block-title { font-size: .95rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.badge { background: #03c75a; color: #fff; font-size: .7rem; padding: 2px 9px; border-radius: 20px; margin-left: 6px; }
.dl-btn { display: inline-flex; align-items: center; gap: 5px; background: #1976d2; color: #fff; font-size: .78rem; font-weight: 600; padding: 5px 13px; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; }
.dl-btn:hover { background: #1565c0; }
.kw-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.kw-tag { background: #f0f8ff; border: 1px solid #bbd6f5; border-radius: 20px; padding: 4px 12px; font-size: .83rem; color: #1565c0; }
.spinner { display: inline-block; width: 14px; height: 14px; vertical-align: middle; border: 2.5px solid #c8e6c9; border-top-color: #03c75a; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress-wrap { margin-top: 8px; background: #e0e0e0; border-radius: 6px; height: 8px; overflow: hidden; }
.progress-bar { height: 100%; background: #03c75a; border-radius: 6px; transition: width .4s; }
.progress-text { font-size: .78rem; color: #666; margin-top: 4px; }
.info-box { background: #f8f9fb; border-radius: 8px; padding: 12px 16px; font-size: .82rem; color: #666; line-height: 1.7; margin-bottom: 16px; }
.info-box b { color: #333; }
</style>
</head>
<body>
<header>
  <a href="/">&larr; 홈</a>
  <h1>&#128161; 자동완성 키워드 수집</h1>
</header>
<div class="wrap">
  <div class="card">
    <div class="info-box">
      <b>작동 방식</b>: 입력한 키워드의 네이버 <b>자동완성</b> + <b>함께 많이 찾는</b> 결과를 모두 수집하고, 그 결과를 다시 검색해 연관 키워드를 확장합니다.<br>
      <b>깊이 1</b>: 시드 키워드 1개 → 자동완성 + 함께 많이 찾는 수집 (약 10~30초)<br>
      <b>깊이 2</b>: 깊이 1 결과를 다시 검색 → 연관 키워드 대량 수집 (수 분 소요)
    </div>
    <label class="lbl">시드 키워드</label>
    <p class="hint">자동완성을 탐색할 시작 키워드</p>
    <input type="text" id="seedInput" placeholder="예: 수원한방병원" />
    <div class="row">
      <div class="sel-wrap">
        <label class="lbl" style="margin-bottom:4px">탐색 깊이</label>
        <select id="depthSelect">
          <option value="1">깊이 1 (빠름)</option>
          <option value="2" selected>깊이 2 (권장)</option>
          <option value="3">깊이 3 (느림)</option>
        </select>
      </div>
      <button class="run" id="runBtn" onclick="startSuggest()">키워드 수집 시작</button>
    </div>
  </div>
  <div id="status" class="sbar"></div>
  <div id="progressWrap" style="display:none; margin-bottom:14px;">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>
  <div id="results"></div>
</div>
<script>
let timer = null;
function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setStatus(t, m) {
  const el = document.getElementById('status');
  el.className = 'sbar ' + t; el.style.display = 'block';
  el.innerHTML = (t==='running' ? '<span class="spinner"></span>' : '') + m;
}
async function startSuggest() {
  const seed = document.getElementById('seedInput').value.trim();
  if (!seed) { alert('시드 키워드를 입력하세요.'); return; }
  const depth = parseInt(document.getElementById('depthSelect').value);
  document.getElementById('runBtn').disabled = true;
  document.getElementById('results').innerHTML = '';
  document.getElementById('progressWrap').style.display = 'none';
  setStatus('running', '자동완성 키워드 수집 중…');
  const { job_id, error } = await (await fetch('/api/suggest', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({seed, max_depth: depth})
  })).json();
  if (error) { setStatus('error', error); document.getElementById('runBtn').disabled = false; return; }
  timer = setInterval(() => poll(job_id), 2000);
}
async function poll(job_id) {
  const job = await (await fetch('/api/status/' + job_id)).json();
  if (job.total > 0) {
    const pct = Math.round(job.done_count / job.total * 100);
    document.getElementById('progressWrap').style.display = 'block';
    document.getElementById('progressBar').style.width = pct + '%';
    const depthLabel = job.depth !== undefined ? ` | 깊이 ${job.depth}` : '';
    const lastKw = job.last_kw ? ` | 마지막: "${esc(job.last_kw)}"` : '';
    document.getElementById('progressText').textContent =
      job.done_count + ' / ' + job.total + '개 완료 (' + pct + '%)' + depthLabel + lastKw;
    setStatus('running', `자동완성 키워드 수집 중… (깊이 ${job.depth ?? 0} 진행 중)`);
  }
  if (job.status === 'running' || job.status === 'pending') return;
  clearInterval(timer);
  document.getElementById('runBtn').disabled = false;
  if (job.status === 'error') { setStatus('error', '오류: ' + job.error); return; }
  const cnt = (job.keywords || []).length;
  setStatus('done', '완료! 총 ' + cnt + '개 키워드 수집됨.');
  const wrap = document.getElementById('results');
  wrap.innerHTML = '';
  if (!cnt) return;
  const b = document.createElement('div'); b.className = 'card';
  const dl = '<button class="dl-btn" onclick="dl(\'' + job_id + '\')">&#8595; CSV 다운로드</button>';
  const tags = job.keywords.map(k => '<span class="kw-tag">' + esc(k) + '</span>').join('');
  b.innerHTML = '<div class="block-title"><span>수집 결과<span class="badge">' + cnt + '개</span></span>' + dl + '</div><div class="kw-grid">' + tags + '</div>';
  wrap.appendChild(b);
}
function dl(job_id) { window.location = '/api/suggest/download?job_id=' + job_id; }
</script>
</body>
</html>
