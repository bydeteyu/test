<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카페글 노출 알림</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f0f2f7; min-height: 100vh; }
header { background: #1a1a2e; color: #fff; padding: 16px 28px; display: flex; align-items: center; gap: 16px; }
header a { color: rgba(255,255,255,.5); text-decoration: none; font-size: .85rem; }
header a:hover { color: #fff; }
header h1 { font-size: 1rem; font-weight: 700; color: #fff; }
.wrap { max-width: 860px; margin: 32px auto; padding: 0 18px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,.06); padding: 24px; margin-bottom: 20px; }
label.lbl { display: block; font-weight: 600; margin-bottom: 6px; font-size: .92rem; }
.hint { font-size: .78rem; color: #aaa; margin-bottom: 9px; }
.row { display: flex; gap: 8px; }
input[type=text] { flex: 1; border: 1.5px solid #e0e3ed; border-radius: 8px; padding: 10px 12px; font-size: .9rem; outline: none; background: #fafbfd; }
input[type=text]:focus { border-color: #03c75a; background: #fff; }
button { border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
button.add { padding: 0 18px; background: #03c75a; color: #fff; font-size: .9rem; }
button.add:hover { background: #02a84b; }
button.run { margin-top: 14px; width: 100%; padding: 12px; background: #1976d2; color: #fff; font-size: .97rem; }
button.run:hover { background: #1565c0; }
button.run:disabled { background: #90caf9; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: #f0f4ff; color: #24408e; border-radius: 20px; padding: 6px 8px 6px 14px; font-size: .84rem; }
.chip button { background: none; color: #8792ad; font-size: 1rem; line-height: 1; padding: 2px 6px; border-radius: 50%; }
.chip button:hover { background: #dde4f5; color: #24408e; }
.empty { color: #ccc; font-size: .87rem; padding: 6px 0; }
.status-line { font-size: .82rem; color: #666; margin-bottom: 4px; }
.status-line b { color: #333; }
.sbar { display: none; padding: 10px 14px; border-radius: 8px; font-size: .87rem; margin-top: 12px; }
.sbar.running { display: block; background: #fff8e1; color: #9a6e00; border: 1px solid #ffe082; }
.sbar.done    { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
.sbar.error   { display: block; background: #fce4ec; color: #c62828; border: 1px solid #f48fb1; }
.result-block { margin-top: 14px; }
.result-kw { font-weight: 700; font-size: .9rem; margin-top: 10px; }
ul.posts { margin: 4px 0 0 18px; font-size: .84rem; }
ul.posts li { margin-bottom: 3px; }
ul.posts a { color: #1976d2; text-decoration: none; }
.bulk-toggle { background: none; color: #1976d2; font-size: .8rem; font-weight: 600; padding: 6px 0; }
textarea#bulkInput { display: none; width: 100%; height: 100px; border: 1.5px solid #e0e3ed; border-radius: 8px; padding: 10px 12px; font-size: .87rem; resize: vertical; outline: none; background: #fafbfd; margin-top: 8px; }
textarea#bulkInput:focus { border-color: #03c75a; background: #fff; }
button.bulk-add { display: none; margin-top: 8px; padding: 9px 16px; background: #03c75a; color: #fff; font-size: .87rem; }
button.bulk-add:hover { background: #02a84b; }
.progress-wrap { margin-top: 10px; background: #e0e0e0; border-radius: 6px; height: 8px; overflow: hidden; display: none; }
.progress-bar { height: 100%; background: #1976d2; border-radius: 6px; transition: width .4s; }
.progress-text { font-size: .78rem; color: #666; margin-top: 4px; }

.mon-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.mon-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1.5px solid #eceef4; border-radius: 10px; text-decoration: none; color: inherit; }
.mon-item:hover { border-color: #1976d2; }
.mon-item.active { border-color: #1976d2; background: #f3f8ff; }
.mon-item .name { font-weight: 700; font-size: .92rem; }
.mon-item .meta { font-size: .78rem; color: #888; margin-top: 2px; }
.mon-item .del { background: none; color: #c62828; font-size: .78rem; padding: 4px 8px; }
.badge-slack { display: inline-block; font-size: .68rem; padding: 1px 7px; border-radius: 10px; margin-left: 6px; }
.badge-slack.on { background: #e8f5e9; color: #2e7d32; }
.badge-slack.off { background: #fbe9e7; color: #b71c1c; }
.new-mon-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.new-mon-row input { flex: 1; min-width: 160px; }

details.hist-item { border: 1px solid #eee; border-radius: 8px; padding: 8px 12px; margin-top: 8px; }
details.hist-item summary { cursor: pointer; font-size: .85rem; font-weight: 600; }
details.hist-item summary .muted { font-weight: 400; color: #888; }
</style>
</head>
<body>
<header>
  <a href="/">&larr; 홈</a>
  <h1>&#128276; 카페글 노출 알림</h1>
</header>
<div class="wrap">
  <div class="card">
    <label class="lbl">모니터 목록</label>
    <p class="hint">모니터마다 감시 키워드·슬랙 알림 채널·확인 시각을 따로 관리할 수 있습니다. 각자 정해진 시각(KST)에 자동 확인하며, 시각이 겹치더라도 안정성을 위해 동시에 실행하지 않고 순서대로 처리합니다.</p>
    <div class="mon-list" id="monList"></div>
    <div class="empty" id="monEmpty" style="display:none;">등록된 모니터가 없습니다. 아래에서 새로 만들어주세요.</div>
    <div class="new-mon-row">
      <input type="text" id="newMonName" placeholder="새 모니터 이름 (예: 사업장A)">
      <input type="text" id="newMonWebhook" placeholder="슬랙 웹훅 URL (선택, 비워두면 기본 채널 사용)">
      <input type="time" id="newMonTime" value="10:00" style="flex:0 0 110px;">
      <button class="add" onclick="createMonitor()">모니터 추가</button>
    </div>
  </div>

  <div id="detail" style="display:none;">
    <div class="card">
      <label class="lbl" id="detailTitle">감시 키워드</label>
      <div class="status-line" id="webhookLine"></div>
      <div class="row" style="margin-top:8px;">
        <input type="text" id="webhookInput" placeholder="슬랙 웹훅 URL (비워두면 기본 채널 사용)">
        <input type="time" id="scheduleInput" style="flex:0 0 110px;">
        <button class="add" onclick="saveWebhook()">저장</button>
      </div>
      <div class="hint" style="margin-top:6px;">매일 이 시각(KST)에 자동으로 확인해 슬랙으로 보냅니다.</div>

      <div class="row" style="margin-top:16px;">
        <input type="text" id="kwInput" placeholder="예: 수원한방병원 추천" onkeydown="if(event.key==='Enter')addKeyword()">
        <button class="add" onclick="addKeyword()">추가</button>
      </div>
      <button class="bulk-toggle" id="bulkToggle" onclick="toggleBulk()">+ 여러 개 한번에 붙여넣기</button>
      <textarea id="bulkInput" placeholder="한 줄에 하나씩 또는 콤마(,)로 구분&#10;수원한방병원 추천&#10;수원 교통사고 한의원"></textarea>
      <button class="bulk-add" id="bulkAddBtn" onclick="addBulkKeywords()">일괄 추가</button>
      <div class="chips" id="chips"></div>
      <div class="empty" id="emptyMsg" style="display:none;">등록된 감시 키워드가 없습니다.</div>
    </div>

    <div class="card">
      <button class="run" id="runBtn" onclick="runNow()">지금 바로 확인</button>
      <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
      <div class="progress-text" id="progressText"></div>
      <div id="status" class="sbar"></div>
      <div id="results"></div>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <label class="lbl" style="margin-bottom:0;">실행 히스토리 (최근 30회)</label>
        <button class="del" style="background:none; color:#c62828; font-size:.8rem; font-weight:600; padding:4px 8px;" onclick="clearHistory()">히스토리 초기화</button>
      </div>
      <div id="historyList"></div>
      <div class="empty" id="historyEmpty" style="display:none;">아직 실행 기록이 없습니다.</div>
    </div>
  </div>
</div>

<script>
function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const params = new URLSearchParams(location.search);
let currentMonitorId = params.get('monitor') || null;

async function loadMonitors() {
  const res = await fetch('/api/monitors');
  const data = await res.json();
  const list = document.getElementById('monList');
  const empty = document.getElementById('monEmpty');
  list.innerHTML = '';
  if (!data.monitors.length) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    data.monitors.forEach(m => {
      const el = document.createElement('a');
      el.href = '/keywords?monitor=' + encodeURIComponent(m.id);
      el.className = 'mon-item' + (m.id === currentMonitorId ? ' active' : '');
      const lastLine = m.last_run ? `마지막 확인: ${esc(m.last_run.ran_at)} · 노출 ${m.last_run.total_hits}건` : '아직 실행 안함';
      const slackBadge = m.slack_configured
        ? `<span class="badge-slack on">슬랙 ${m.has_own_webhook ? '전용' : '기본'}</span>`
        : `<span class="badge-slack off">슬랙 미설정</span>`;
      el.innerHTML = `
        <div>
          <span class="name">${esc(m.name)}${slackBadge}</span>
          <div class="meta">매일 ${esc(m.schedule_time)} · 키워드 ${m.keyword_count}개 · ${lastLine}</div>
        </div>
        <button class="del" onclick="event.preventDefault(); deleteMonitor('${m.id}', '${esc(m.name).replace(/'/g,"\\'")}')">삭제</button>
      `;
      list.appendChild(el);
    });
  }

  if (currentMonitorId && !data.monitors.some(m => m.id === currentMonitorId)) {
    currentMonitorId = null;
    document.getElementById('detail').style.display = 'none';
  }
}

async function createMonitor() {
  const nameInput = document.getElementById('newMonName');
  const webhookInput = document.getElementById('newMonWebhook');
  const timeInput = document.getElementById('newMonTime');
  const name = nameInput.value.trim();
  if (!name) { alert('모니터 이름을 입력하세요.'); return; }
  const res = await fetch('/api/monitors', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, slack_webhook_url: webhookInput.value.trim(), schedule_time: timeInput.value || '10:00' }),
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error || '생성 실패'); return; }
  nameInput.value = '';
  webhookInput.value = '';
  location.href = '/keywords?monitor=' + encodeURIComponent(data.monitor.id);
}

async function deleteMonitor(id, name) {
  if (!confirm(`"${name}" 모니터를 삭제하시겠습니까? 키워드와 실행 기록이 모두 사라집니다.`)) return;
  await fetch('/api/monitors/' + encodeURIComponent(id), { method: 'DELETE' });
  if (id === currentMonitorId) {
    location.href = '/keywords';
  } else {
    loadMonitors();
  }
}

async function loadKeywords() {
  const res = await fetch(`/api/monitors/${currentMonitorId}/keywords`);
  const data = await res.json();
  const chips = document.getElementById('chips');
  const empty = document.getElementById('emptyMsg');
  chips.innerHTML = '';
  if (!data.keywords.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  data.keywords.forEach(kw => {
    const el = document.createElement('span');
    el.className = 'chip';
    el.innerHTML = `${esc(kw)} <button onclick="removeKeyword('${esc(kw).replace(/'/g,"\\'")}')">&times;</button>`;
    chips.appendChild(el);
  });
}

async function addKeyword() {
  const input = document.getElementById('kwInput');
  const keyword = input.value.trim();
  if (!keyword) return;
  await fetch(`/api/monitors/${currentMonitorId}/keywords`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ keyword }),
  });
  input.value = '';
  loadKeywords();
  loadMonitors();
}

async function removeKeyword(keyword) {
  await fetch(`/api/monitors/${currentMonitorId}/keywords/` + encodeURIComponent(keyword), { method: 'DELETE' });
  loadKeywords();
  loadMonitors();
}

function toggleBulk() {
  const box = document.getElementById('bulkInput');
  const btn = document.getElementById('bulkAddBtn');
  const shown = box.style.display === 'block';
  box.style.display = shown ? 'none' : 'block';
  btn.style.display = shown ? 'none' : 'inline-block';
}

async function addBulkKeywords() {
  const box = document.getElementById('bulkInput');
  const raw = box.value.trim();
  if (!raw) return;
  const res = await fetch(`/api/monitors/${currentMonitorId}/keywords/bulk`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ keywords: raw }),
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error || '일괄 추가 실패'); return; }
  box.value = '';
  toggleBulk();
  loadKeywords();
  loadMonitors();
}

async function saveWebhook() {
  const webhookInput = document.getElementById('webhookInput');
  const scheduleInput = document.getElementById('scheduleInput');
  await fetch(`/api/monitors/${currentMonitorId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      slack_webhook_url: webhookInput.value.trim(),
      schedule_time: scheduleInput.value || '10:00',
    }),
  });
  loadMonitorDetail();
  loadMonitors();
}

async function clearHistory() {
  if (!confirm('이 모니터의 실행 히스토리를 모두 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
  await fetch(`/api/monitors/${currentMonitorId}/history`, { method: 'DELETE' });
  loadMonitorDetail();
  loadMonitors();
}

function renderResults(results) {
  const wrap = document.getElementById('results');
  wrap.innerHTML = '';
  const block = document.createElement('div');
  block.className = 'result-block';
  results.forEach(r => {
    const h = document.createElement('div');
    if (r.error) {
      h.className = 'result-kw';
      h.textContent = `⚠️ ${r.keyword} — 확인 실패: ${r.error}`;
      block.appendChild(h);
      return;
    }
    h.className = 'result-kw';
    h.textContent = (r.posts.length ? '✅ ' : '⬜ ') + r.keyword + ' — ' + r.posts.length + '건 노출';
    block.appendChild(h);
    if (r.posts.length) {
      const ul = document.createElement('ul');
      ul.className = 'posts';
      r.posts.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="${esc(p['링크'])}" target="_blank">${esc(p['제목'])}</a> (${esc(p['카페이름'])})`;
        ul.appendChild(li);
      });
      block.appendChild(ul);
    }
  });
  wrap.appendChild(block);
}

function renderHistory(history) {
  const list = document.getElementById('historyList');
  const empty = document.getElementById('historyEmpty');
  list.innerHTML = '';
  if (!history.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  history.forEach((run, idx) => {
    const d = document.createElement('details');
    d.className = 'hist-item';
    if (idx === 0) d.open = true;
    const notifyNote = run.notified ? '슬랙 전송됨' : (run.notify_error ? `전송 안됨(${esc(run.notify_error)})` : '');
    d.innerHTML = `<summary>${esc(run.ran_at)} <span class="muted">· 키워드 ${run.keywords_checked}개 · 노출 ${run.total_hits}건${notifyNote ? ' · ' + notifyNote : ''}</span></summary>`;
    const body = document.createElement('div');
    body.style.marginTop = '8px';
    run.results.forEach(r => {
      const row = document.createElement('div');
      row.style.fontSize = '.83rem';
      row.style.marginTop = '6px';
      if (r.error) {
        row.innerHTML = `⚠️ <b>${esc(r.keyword)}</b> — 확인 실패: ${esc(r.error)}`;
      } else if (!r.posts.length) {
        row.innerHTML = `⬜ <b>${esc(r.keyword)}</b> — 노출 없음`;
      } else {
        const links = r.posts.map(p => `<a href="${esc(p['링크'])}" target="_blank" style="color:#1976d2;text-decoration:none;">${esc(p['제목'])}</a> (${esc(p['카페이름'])})`).join('<br>');
        row.innerHTML = `✅ <b>${esc(r.keyword)}</b> — ${r.posts.length}건<br><span style="margin-left:14px;">${links}</span>`;
      }
      body.appendChild(row);
    });
    d.appendChild(body);
    list.appendChild(d);
  });
}

async function loadMonitorDetail() {
  const res = await fetch('/api/monitors');
  const data = await res.json();
  const m = data.monitors.find(x => x.id === currentMonitorId);
  if (!m) { document.getElementById('detail').style.display = 'none'; return; }

  document.getElementById('detail').style.display = 'block';
  document.getElementById('detailTitle').textContent = `${m.name} — 감시 키워드`;
  document.getElementById('webhookLine').innerHTML = m.slack_configured
    ? `슬랙 연동: <b>${m.has_own_webhook ? '이 모니터 전용 채널' : '기본 채널(SLACK_WEBHOOK_URL)'}</b>`
    : '슬랙 연동: <b>미설정</b> — 아래에 웹훅 URL을 등록하세요.';
  document.getElementById('webhookInput').value = m.slack_webhook_url || '';
  document.getElementById('scheduleInput').value = m.schedule_time || '10:00';

  const hRes = await fetch(`/api/monitors/${currentMonitorId}/history`);
  const hData = await hRes.json();
  renderHistory(hData.history || []);
  renderResults((hData.history && hData.history.length) ? (hData.history[0].results || []) : []);
}

let timer = null;
async function runNow() {
  const btn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  const progressWrap = document.getElementById('progressWrap');
  const progressText = document.getElementById('progressText');
  btn.disabled = true;
  status.className = 'sbar running';
  status.textContent = '확인 중입니다… (안정성을 위해 키워드를 하나씩 순차 확인합니다. 키워드가 많으면 오래 걸릴 수 있어요)';
  progressWrap.style.display = 'block';
  document.getElementById('progressBar').style.width = '0%';
  progressText.textContent = '';
  let job_id, error;
  try {
    const res = await fetch(`/api/monitors/${currentMonitorId}/run-now`, { method: 'POST' });
    ({ job_id, error } = await res.json());
    if (!res.ok) throw new Error(error || '요청 실패');
  } catch (e) {
    status.className = 'sbar error';
    status.textContent = '오류: ' + e.message;
    btn.disabled = false;
    progressWrap.style.display = 'none';
    return;
  }
  timer = setInterval(() => pollAlert(job_id), 2000);
}

async function pollAlert(job_id) {
  const res = await fetch('/api/alert/status/' + job_id);
  if (!res.ok) return;
  const job = await res.json();

  const total = job.total || 0;
  const done = job.done_count || 0;
  if (total > 0) {
    const pct = Math.round((done / total) * 100);
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = `${done} / ${total}개 확인 (${pct}%)`;
  }

  if (job.status !== 'done') return;
  clearInterval(timer);
  document.getElementById('runBtn').disabled = false;
  document.getElementById('progressWrap').style.display = 'none';
  const status = document.getElementById('status');
  status.className = 'sbar done';
  status.textContent = `완료! 키워드 ${job.keywords_checked}개 확인, ${job.total_hits}건 노출` +
    (job.notified ? ' · 슬랙 전송됨' : (job.notify_error ? ` · 전송 안됨(${job.notify_error})` : ''));
  renderResults(job.results || []);
  loadMonitorDetail();
  loadMonitors();
}

loadMonitors();
if (currentMonitorId) {
  loadKeywords();
  loadMonitorDetail();
}
</script>
</body>
</html>
