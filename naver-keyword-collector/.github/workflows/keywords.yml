name: Naver Keyword Collector

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 00:00 UTC = 09:00 KST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: naver-keyword-collector

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: naver-keyword-collector/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run keyword collector
        env:
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY }}
          NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID }}
        run: python naver_keywords.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: keywords-${{ github.run_id }}
          path: naver-keyword-collector/output/*.csv
          retention-days: 90
