<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈</title>
<style>
:root{color-scheme:light;--bg:#F1F2F6;--surface:#fff;--ink:#1A1C2E;--ink-soft:#6A6F85;--border:#E2E4EC;--accent:#03A94D;--head:#1A1C2E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161F;--surface:#1E212E;--ink:#ECEEF6;--ink-soft:#9AA0B8;--border:#2E3243;--accent:#2FD27A;--head:#0E1018}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--head);color:#fff;padding:22px 28px}
header h1{margin:0;font-size:1.35rem;color:var(--accent)}
header p{margin:6px 0 0;font-size:.85rem;color:#aab0c8}
header .who{float:right;font-size:.82rem;color:#aab0c8}header .who a{color:#fff;margin-left:8px}
main{max-width:1060px;margin:34px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
a.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:18px;padding:30px 28px;text-decoration:none;color:inherit;box-shadow:0 2px 10px rgba(20,22,40,.07);min-height:230px;transition:transform .12s,box-shadow .12s}
a.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,22,40,.13)}
.ico{font-size:2.3rem;line-height:1}
.card h2{margin:6px 0 0;font-size:1.15rem}
.card p{margin:0;color:var(--ink-soft);font-size:.88rem;line-height:1.55;flex:1}
.go{color:var(--accent);font-weight:700;font-size:.9rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <span class="who" id="who"></span>
  <h1>마케팅 관리 도구</h1>
  <p>키워드 리서치 · 순위 체크 · Threads 조회수</p>
</header>
<main id="cards"></main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CARDS = [
  { href: "/rank.html", ico: "🏆", title: "순위 체크", desc: "키워드 검색 → 통합·카페 순위와 콘텐츠 조회수를 매일 기록하고, 차트와 엑셀로 확인합니다.", all: true },
  { href: "/threads.html", ico: "🧵", title: "Threads 조회수 추적", desc: "연결한 Threads 계정의 게시글 조회수·좋아요·댓글을 매일 기록하고 증감 차트로 확인합니다.", all: true },
  { href: "/", ico: "🔍", title: "키워드 리서치 보드", desc: "클라이언트별 키워드 리서치·평가·채택, 카페 모니터링과 AI 키워드 확장을 관리합니다.", all: false },
  { href: "/admin.html", ico: "👥", title: "계정 관리", desc: "회원 계정을 만들고 볼 수 있는 프로젝트를 지정합니다.", all: false },
];
(async () => {
  let me = { role: "admin" };
  try {
    const r = await fetch("/api/me");
    if (r.status === 401) { location.href = "/login.html"; return; }
    me = await r.json();
  } catch { /* 열린 상태로 표시 */ }
  const viewer = me.role === "viewer";
  document.getElementById("who").innerHTML = me.openMode ? "" : `${esc(me.name || me.username)} (${viewer ? "회원" : "관리자"}) <a href="#" id="lo">로그아웃</a>`;
  const lo = document.getElementById("lo");
  if (lo) lo.addEventListener("click", async (e) => { e.preventDefault(); await fetch("/api/logout", { method: "POST" }); location.href = "/login.html"; });
  document.getElementById("cards").innerHTML = CARDS.filter((c) => c.all || !viewer).map((c) => `<a class="card" href="${c.href}"><div class="ico">${c.ico}</div><h2>${esc(c.title)}</h2><p>${esc(c.desc)}</p><span class="go">시작하기 →</span></a>`).join("");
})();
</script>
</body>
</html>
