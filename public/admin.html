<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계정 관리</title>
<style>
:root{color-scheme:light;--bg:#F7F5F0;--surface:#fff;--surface-2:#F0ECE3;--ink:#1E2420;--ink-soft:#63706A;--border:#DDD6C8;--accent:#0E6E58;--accent-ink:#fff;--bad:#AE4430;--bad-soft:#FBE9E3;--good:#1F7A4D;--good-soft:#E4F5EA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14181A;--surface:#1C2220;--surface-2:#232B28;--ink:#ECEFEC;--ink-soft:#9AA6A0;--border:#313A36;--accent:#3FCB9F;--accent-ink:#0B1512;--bad:#FF7A5C;--bad-soft:#2E1B16;--good:#4ADE94;--good-soft:#17281F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 48px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{margin:0}h1{font-size:1.3rem}h2{font-size:1.02rem}
a{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--ink-soft);flex:1 1 180px}
input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--ink);min-width:0}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--ink);padding:7px 12px;font-size:.82rem}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;padding:9px 16px;font-size:.9rem}
button.danger{color:var(--bad);border-color:var(--bad-soft)}
.meta{font-size:.8rem;color:var(--ink-soft)}
.checks{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.85rem}
.checks label{flex:0 0 auto;flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.msg{border-radius:8px;padding:8px 10px;font-size:.84rem}.msg.ok{background:var(--good-soft);color:var(--good)}.msg.err{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;background:var(--surface-2);border-radius:999px;padding:2px 8px;font-size:.74rem;margin:1px 3px 1px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="row" style="justify-content:space-between;align-items:center">
    <h1>계정 관리</h1>
    <div class="meta"><a href="/rank.html">← 순위 체크</a> · <a href="#" id="logout">로그아웃</a></div>
  </header>

  <div class="msg err" id="openWarn" hidden>로그인이 꺼져 있습니다. 서버 환경 변수 <code>APP_PASSWORD</code>를 설정해 관리자 로그인을 먼저 켜야 회원 계정을 만들 수 있습니다.</div>
  <div class="msg" id="msg" hidden></div>

  <section class="card">
    <h2>회원 계정 만들기</h2>
    <div class="meta">회원은 지정한 프로젝트의 <b>순위표를 보기만</b> 할 수 있습니다. 조회·추가·삭제 등은 할 수 없습니다.</div>
    <form id="createForm" class="row">
      <label>표시 이름(선택)<input name="name" maxlength="60" placeholder="예: 교보라이프플래닛"></label>
      <label>아이디<input name="username" required pattern="[A-Za-z0-9_.\-]{3,32}" placeholder="영문·숫자 3~32자" autocomplete="off"></label>
      <label>비밀번호(8자 이상)<input name="password" type="text" required minlength="8" autocomplete="off"></label>
    </form>
    <div><div class="meta" style="margin-bottom:6px">볼 수 있는 프로젝트</div><div class="checks" id="createProjects"></div></div>
    <div><button class="primary" type="submit" form="createForm">계정 만들기</button></div>
  </section>

  <section class="card">
    <h2>계정 목록</h2>
    <div class="meta" id="adminInfo"></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>아이디</th><th>표시 이름</th><th>프로젝트</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (url, method = "GET", body) => {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = "/login.html"; throw new Error("login"); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.message || "요청에 실패했습니다."), { status: r.status });
  return d;
};
const say = (t, ok = true) => { const m = $("#msg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); m.hidden = false; };
let projects = [], users = [];

async function load() {
  const me = await api("/api/me");
  if (me.role !== "admin") { location.href = "/rank.html"; return; }
  projects = await api("/api/projects");
  const d = await api("/api/users");
  users = d.users;
  $("#openWarn").hidden = !d.openMode;
  $("#adminInfo").textContent = d.admin ? `관리자 계정: ${d.admin} (비밀번호는 서버 환경 변수 APP_PASSWORD 로 관리합니다)` : "";
  $("#createProjects").innerHTML = projects.length ? projects.map((p) => `<label><input type="checkbox" name="pj" value="${esc(p.id)}"> ${esc(p.name)}</label>`).join("") : '<span class="meta">프로젝트가 없습니다. 순위 체크 화면에서 먼저 프로젝트를 만드세요.</span>';
  renderRows();
}
const pname = (id) => (projects.find((p) => p.id === id) || { name: "(삭제된 프로젝트)" }).name;
function renderRows() {
  $("#rows").innerHTML = users.length ? users.map((u) => `<tr data-id="${esc(u.id)}">
    <td><b>${esc(u.username)}</b></td><td>${esc(u.name)}</td>
    <td>${u.projectIds.length ? u.projectIds.map((id) => `<span class="tag">${esc(pname(id))}</span>`).join("") : '<span class="meta">없음</span>'}</td>
    <td style="white-space:nowrap"><button data-act="proj">프로젝트 수정</button> <button data-act="pw">비밀번호 변경</button> <button class="danger" data-act="del">삭제</button></td></tr>`).join("") : '<tr><td colspan="4" class="meta">만든 회원 계정이 없습니다.</td></tr>';
}
$("#createForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const projectIds = [...document.querySelectorAll('#createProjects input:checked')].map((x) => x.value);
  if (!projectIds.length && !confirm("연결된 프로젝트가 없으면 로그인해도 볼 수 있는 것이 없습니다. 그래도 만들까요?")) return;
  try { await api("/api/users", "POST", { ...f, projectIds }); e.target.reset(); document.querySelectorAll('#createProjects input').forEach((x) => (x.checked = false)); say(`계정을 만들었습니다. 아이디 "${f.username}", 비밀번호 "${f.password}" 를 회원에게 전달하세요.`); await load(); }
  catch (er) { say(er.message, false); }
});
$("#rows").addEventListener("click", async (e) => {
  const act = e.target.dataset.act; if (!act) return;
  const tr = e.target.closest("tr"), u = users.find((x) => x.id === tr.dataset.id);
  try {
    if (act === "del") { if (confirm(`"${u.username}" 계정을 삭제할까요?`)) { await api("/api/users/" + u.id, "DELETE"); say("삭제했습니다."); await load(); } }
    else if (act === "pw") { const pw = prompt(`"${u.username}" 의 새 비밀번호 (8자 이상)`); if (pw) { await api("/api/users/" + u.id, "PATCH", { password: pw }); say(`비밀번호를 바꿨습니다. 새 비밀번호: ${pw} (기존 로그인은 해제됩니다)`); } }
    else if (act === "proj") {
      const cell = tr.children[2];
      cell.innerHTML = '<div class="checks">' + projects.map((p) => `<label><input type="checkbox" value="${esc(p.id)}" ${u.projectIds.includes(p.id) ? "checked" : ""}> ${esc(p.name)}</label>`).join("") + '</div><button data-act="save" style="margin-top:6px">저장</button>';
    } else if (act === "save") {
      const ids = [...tr.querySelectorAll('input:checked')].map((x) => x.value);
      await api("/api/users/" + u.id, "PATCH", { projectIds: ids }); say("프로젝트를 저장했습니다."); await load();
    }
  } catch (er) { say(er.message, false); }
});
$("#logout").addEventListener("click", async (e) => { e.preventDefault(); await fetch("/api/logout", { method: "POST" }); location.href = "/login.html"; });
load().catch(() => {});
</script>
</body>
</html>
