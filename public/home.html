<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈</title>
<style>
:root{color-scheme:light;--bg:#F1F2F6;--surface:#fff;--ink:#1A1C2E;--ink-soft:#6A6F85;--accent:#03A94D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161F;--surface:#1E212E;--ink:#ECEEF6;--ink-soft:#9AA0B8;--accent:#2FD27A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 48px}
.top{max-width:1060px;margin:26px auto 0;padding:0 4px}
.top h1{margin:0;font-size:1.5rem;color:var(--accent)}
.top p{margin:6px 0 0;font-size:.88rem;color:var(--ink-soft)}
main{max-width:1060px;margin:22px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
a.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:18px;padding:30px 28px;text-decoration:none;color:inherit;box-shadow:0 2px 10px rgba(20,22,40,.07);min-height:230px;transition:transform .12s,box-shadow .12s}
a.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,22,40,.13)}
.ico{font-size:2.3rem;line-height:1}
.card h2{margin:6px 0 0;font-size:1.15rem}
.card p{margin:0;color:var(--ink-soft);font-size:.88rem;line-height:1.55;flex:1}
.go{color:var(--accent);font-weight:700;font-size:.9rem}
</style>
</head>
<body>
<div class="top"><h1>마케팅 관리 도구</h1><p>사용할 프로그램을 선택하세요. 왼쪽 위 ☰ 버튼으로 어느 화면에서나 다른 프로그램으로 이동할 수 있습니다.</p></div>
<main id="cards"></main>
<script src="/programs.js"></script>
<script>
Programs.mountBar("home");
Programs.getMe().then((me) => {
  document.getElementById("cards").innerHTML = Programs.visible(me).map((c) => `<a class="card" href="${Programs.esc(c.href)}"><div class="ico">${c.icon}</div><h2>${Programs.esc(c.title)}</h2><p>${Programs.esc(c.desc)}</p><span class="go">시작하기 →</span></a>`).join("");
});
</script>
</body>
</html>
