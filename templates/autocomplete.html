<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동완성 파생 키워드</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f0f2f7; min-height: 100vh; }
header { background: #1a1a2e; color: #fff; padding: 16px 28px; display: flex; align-items: center; gap: 16px; }
header a { color: rgba(255,255,255,.5); text-decoration: none; font-size: .85rem; }
header a:hover { color: #fff; }
header h1 { font-size: 1rem; font-weight: 700; color: #fff; }
.wrap { max-width: 860px; margin: 32px auto; padding: 0 18px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,.06); padding: 24px; margin-bottom: 20px; }
label.lbl { display: block; font-weight: 600; margin-bottom: 6px; font-size: .92rem; }
.hint { font-size: .78rem; color: #aaa; margin-bottom: 9px; }
textarea { width: 100%; height: 100px; border: 1.5px solid #e0e3ed; border-radius: 8px; padding: 10px 12px; font-size: .9rem; resize: vertical; outline: none; transition: border .18s; background: #fafbfd; }
textarea:focus { border-color: #6a4cff; background: #fff; }
.depth-row { display: flex; align-items: center; gap: 18px; margin-top: 12px; font-size: .87rem; }
.depth-row label { display: flex; align-items: center; gap: 6px; font-weight: 400; cursor: pointer; }
button.run { margin-top: 14px; width: 100%; padding: 12px; background: #6a4cff; color: #fff; font-size: .97rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: background .2s; }
button.run:hover { background: #5636e0; }
button.run:disabled { background: #c9beff; cursor: not-allowed; }
.sbar { display: none; padding: 10px 14px; border-radius: 8px; font-size: .87rem; margin-bottom: 14px; }
.sbar.running { display: block; background: #fff8e1; color: #9a6e00; border: 1px solid #ffe082; }
.sbar.done    { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
.sbar.error   { display: block; background: #fce4ec; color: #c62828; border: 1px solid #f48fb1; }
.progress-text { font-size: .78rem; color: #666; margin-top: 4px; }
.block-title { font-size: .95rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.badge { background: #6a4cff; color: #fff; font-size: .7rem; padding: 2px 9px; border-radius: 20px; margin-left: 6px; }
.dl-btn { display: inline-flex; align-items: center; gap: 5px; background: #1976d2; color: #fff; font-size: .78rem; font-weight: 600; padding: 5px 13px; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; }
.dl-btn:hover { background: #1565c0; }
.kw-group { margin-top: 10px; }
.kw-group h3 { font-size: .82rem; color: #888; font-weight: 600; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.kchip { background: #f3f0ff; color: #4a32c9; font-size: .82rem; padding: 4px 10px; border-radius: 14px; }
.kchip .parent { color: #a89be0; font-size: .7rem; margin-left: 4px; }
.empty { color: #ccc; font-size: .87rem; padding: 14px 0; }
</style>
</head>
<body>
<header>
  <a href="/">&larr; 홈</a>
  <h1>&#127775; 자동완성 파생 키워드</h1>
</header>
<div class="wrap">
  <div class="card">
    <label class="lbl">시드 키워드</label>
    <p class="hint">한 줄에 하나씩 또는 콤마(,)로 구분. 각 시드마다 네이버 자동완성을 재귀로 확장합니다.</p>
    <textarea id="kwInput" placeholder="수원한방병원&#10;교통사고 한의원"></textarea>
    <div class="depth-row">
      <span>확장 깊이:</span>
      <label><input type="radio" name="depth" value="1"> 1단계 (자동완성만)</label>
      <label><input type="radio" name="depth" value="2" checked> 2단계 (추천 — 자동완성의 자동완성까지)</label>
    </div>
    <button class="run" id="runBtn" onclick="startRun()">파생 키워드 수집 시작</button>
  </div>
  <div id="status" class="sbar"></div>
  <div id="results"></div>
</div>

<script>
let timer = null;
function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setStatus(t, m) {
  const el = document.getElementById('status');
  el.className = 'sbar ' + t; el.style.display = 'block';
  el.innerHTML = m;
}

async function startRun() {
  const raw = document.getElementById('kwInput').value.trim();
  if (!raw) { alert('시드 키워드를 입력하세요.'); return; }
  const depth = document.querySelector('input[name=depth]:checked').value;

  document.getElementById('runBtn').disabled = true;
  document.getElementById('results').innerHTML = '';
  setStatus('running', '수집 중입니다… (시드별로 순서대로, 시드 안에서는 2개씩 병렬 확장)');

  let job_id, error;
  try {
    const res = await fetch('/api/autocomplete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keywords: raw, depth }),
    });
    if (!res.ok) throw new Error('서버 응답 오류 (' + res.status + ')');
    ({ job_id, error } = await res.json());
  } catch (e) {
    setStatus('error', '요청 실패: ' + e.message);
    document.getElementById('runBtn').disabled = false;
    return;
  }
  if (error) { setStatus('error', error); document.getElementById('runBtn').disabled = false; return; }
  timer = setInterval(() => poll(job_id), 1500);
}

async function poll(job_id) {
  let res;
  try { res = await fetch('/api/autocomplete/status/' + job_id); }
  catch (e) { return; }
  if (!res.ok) return;
  let job;
  try { job = await res.json(); } catch (e) { return; }

  if (job.status !== 'done') {
    const p = job.progress;
    let msg = `수집 중입니다… 시드 ${job.seed_done ?? 0}/${job.seed_total ?? '?'}`;
    if (p) msg += ` · "${esc(p.seed)}" ${p.depth}단계 (${p.done}/${p.total}) · 지금까지 ${p.collected}개 발견`;
    setStatus('running', msg);
    return;
  }

  clearInterval(timer);
  document.getElementById('runBtn').disabled = false;
  const totalCount = Object.values(job.results).reduce((s, rows) => s + rows.length, 0);
  const dlBtn = totalCount ? `<a class="dl-btn" style="float:right" href="/api/autocomplete/download?job_id=${job_id}">&#8595; 엑셀(CSV) 다운로드</a>` : '';
  const errNote = (job.errors && job.errors.length) ? ` · 오류 ${job.errors.length}건` : '';
  setStatus('done', `완료! 총 ${totalCount}개 파생 키워드 발견.${errNote} ${dlBtn}`);

  const wrap = document.getElementById('results');
  wrap.innerHTML = '';
  Object.entries(job.results).forEach(([seed, rows]) => {
    const card = document.createElement('div');
    card.className = 'card';
    if (!rows.length) {
      card.innerHTML = `<div class="block-title"><span>${esc(seed)}<span class="badge">0개</span></span></div><div class="empty">파생 키워드를 찾지 못했습니다.</div>`;
      wrap.appendChild(card);
      return;
    }
    let html = `<div class="block-title"><span>${esc(seed)}<span class="badge">${rows.length}개</span></span></div>`;
    for (let d = 1; d <= 2; d++) {
      const group = rows.filter(r => r.depth === d);
      if (!group.length) continue;
      html += `<div class="kw-group"><h3>${d}단계 (${group.length}개)</h3><div class="chips">`;
      html += group.map(r => `<span class="kchip">${esc(r.keyword)}<span class="parent">← ${esc(r.parent)}</span></span>`).join('');
      html += `</div></div>`;
    }
    card.innerHTML = html;
    wrap.appendChild(card);
  });
}
</script>
</body>
</html>
